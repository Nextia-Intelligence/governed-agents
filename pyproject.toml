[project]
name = "blue-kite"
version = "0.1.0"
description = "Sam, the support agent of Blue Kite, and the controls that make it safe to ship."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cedarpy>=4.12.2",
]

[project.scripts]
bluekite = "bluekite.cli:main"
bluekite-capstone = "kit.cli:main"

[project.optional-dependencies]
live = [
    "openai>=3.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluekite", "capstone/kit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
